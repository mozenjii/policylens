[project]
name = "policylens"
version = "0.0.0"
description = "Cited answers about Medicare coverage policy, or an explicit \"not addressed\" when the documents don't say."
readme = "README.md"
# One interpreter, the one the container runs. A range would be a promise I don't test.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mozenjii" }]
keywords = ["medicare", "coverage", "retrieval", "citations", "rag"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # HTTP API and the server-rendered pages. Validation at the boundary comes with it.
  "fastapi>=0.115,<1",
  # The ASGI server the container runs.
  "uvicorn>=0.32,<1",
]

[project.urls]
Source = "https://github.com/mozenjii/policylens"

[dependency-groups]
# Pinned on purpose. A toolchain that drifts turns a green check into an opinion.
dev = [
  "ruff==0.14.2",
  "pyright==1.1.406",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  # Starlette's test client is built on it (httpx2, not httpx: Starlette 1.x deprecates
  # the old package, and pyright can't see the client's types without the new one).
  "httpx2>=2.16,<3",
  # Dependency vulnerability scan. Not part of `check`: it needs the network, so it runs as
  # its own CI job and can't fail a local commit for reasons unrelated to the change.
  "pip-audit==2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policylens"]

# ---------------------------------------------------------------------------
# Lint and format. One tool, so formatting can never disagree with linting.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # import sorting
  "N",           # naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # shadowed builtins
  "C4",          # comprehensions
  "SIM",         # simplify
  "PTH",         # use pathlib
  "RUF",         # ruff's own
  "D",           # docstrings: every module and exported symbol carries one
  "ANN",         # annotations required
  "S",           # bandit security rules
  "T20",         # no stray print() in library code
]
ignore = [
  "D203",   # conflicts with D211; keep D211
  "D213",   # conflicts with D212; keep D212
  "ANN401", # typing.Any is sometimes the honest annotation
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves by name and assert freely.
"tests/**" = ["D100", "D103", "S101"]
# The tools print to a terminal and shell out; that is their whole job.
"tools/**" = ["T201", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Types. Strict from the first commit: retrofitting strictness never happens.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------
# Tests and coverage.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/policylens", "tools"]
# These two only spawn subprocesses and read exit codes. Unit-testing them would test a
# mock of subprocess; instead CI runs both for real on every build.
omit = ["tools/check.py", "tools/verify_gates.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = ["if TYPE_CHECKING:"]
